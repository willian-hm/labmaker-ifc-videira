<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Documentação - LabMaker IFC</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#ffffff;
      color:#111111;
      overflow-x:hidden;
    }

    html{
      scroll-behavior:smooth;
    }

    /* ===== BACKGROUND ===== */

    .bg-grid{
      position:fixed;
      inset:0;
      z-index:-2;

      background-image:
      linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);

      background-size:40px 40px;

      mask-image:radial-gradient(circle at center, black 35%, transparent 100%);
    }

    .blur-circle{
      position:fixed;
      width:500px;
      height:500px;
      border-radius:50%;
      background:#00000010;
      filter:blur(120px);
      z-index:-1;
    }

    .circle1{
      top:-200px;
      left:-100px;
    }

    .circle2{
      bottom:-200px;
      right:-100px;
    }

    /* ===== NAV ===== */

    nav{
      position:fixed;
      top:0;
      left:0;

      width:100%;

      padding:22px 8%;

      display:flex;
      justify-content:space-between;
      align-items:center;

      background:rgba(255,255,255,0.7);
      backdrop-filter:blur(12px);

      border-bottom:1px solid #eeeeee;

      z-index:1000;
    }

    .logo{
      font-size:1.6rem;
      font-weight:800;
      letter-spacing:-2px;
    }

    .logo span{
      font-weight:300;
    }

    nav ul{
      display:flex;
      gap:35px;
      list-style:none;
    }

    nav a{
      text-decoration:none;
      color:#666;
      transition:0.3s;
      font-weight:500;
    }

    nav a:hover{
      color:#000;
    }

    /* ===== MAIN ===== */

    main{
      padding:120px 8%;
      max-width:1200px;
      margin:0 auto;
    }

    .page-header{
      margin-bottom:60px;
      text-align:center;
    }

    .page-header h1{
      font-size:3rem;
      letter-spacing:-3px;
      margin-bottom:20px;
    }

    .page-header p{
      color:#666;
      line-height:1.8;
      max-width:700px;
      margin:0 auto;
    }

    /* ===== CONTENT ===== */

    .content-container{
      background:#fafafa;
      border-radius:30px;
      padding:60px;
      border:1px solid #ececec;
      line-height:1.8;
    }

    .content-container h1,
    .content-container h2,
    .content-container h3,
    .content-container h4,
    .content-container h5,
    .content-container h6{
      margin:40px 0 20px 0;
      color:#111;
    }

    .content-container h1{
      font-size:2.5rem;
      letter-spacing:-2px;
    }

    .content-container h2{
      font-size:2rem;
      letter-spacing:-1px;
    }

    .content-container h3{
      font-size:1.5rem;
    }

    .content-container p{
      margin-bottom:20px;
      color:#666;
    }

    .content-container ul,
    .content-container ol{
      margin-bottom:20px;
      padding-left:30px;
    }

    .content-container li{
      margin-bottom:10px;
      color:#666;
    }

    .content-container blockquote{
      border-left:4px solid #111;
      padding-left:20px;
      margin:30px 0;
      color:#666;
      font-style:italic;
    }

    .content-container img{
      max-width:100%;
      height:auto;
      border-radius:15px;
      margin:30px 0;
    }

    .content-container code{
      background:#f0f0f0;
      padding:5px 10px;
      border-radius:5px;
      font-family:monospace;
    }

    .content-container pre{
      background:#f0f0f0;
      padding:20px;
      border-radius:15px;
      overflow-x:auto;
      margin:30px 0;
    }

    .content-container pre code{
      background:none;
      padding:0;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:#666;
      text-decoration:none;
      font-weight:500;
      margin-bottom:40px;
      transition:0.3s;
    }

    .back-link:hover{
      color:#000;
    }

    /* ===== RESPONSIVO ===== */

    @media(max-width:1000px){
      nav ul{
        display:none;
      }

      main{
        padding:80px 5%;
      }

      .content-container{
        padding:40px 30px;
      }

      .page-header h1{
        font-size:2.5rem;
      }

      .content-container h1{
        font-size:2rem;
      }

      .content-container h2{
        font-size:1.5rem;
      }
    }

  </style>
</head>

<body>

  <div class="bg-grid"></div>

  <div class="blur-circle circle1"></div>
  <div class="blur-circle circle2"></div>

  <!-- NAV -->

  <nav>

    <div class="logo">
      Lab<span>Maker</span>
    </div>

    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="#">Projetos</a></li>
      <li><a href="#">Tecnologias</a></li>
      <li><a href="#">Galeria</a></li>
      <li><a href="#">Contato</a></li>
    </ul>

  </nav>

  <!-- MAIN -->

  <main>
    
    <a href="index.html" class="back-link">
      ← Voltar para o início
    </a>

    <div class="page-header">
      <h1 id="page-title">Carregando...</h1>
      <p id="page-subtitle">Aguarde enquanto o conteúdo é carregado.</p>
    </div>

    <div class="content-container" id="content">
      <!-- O conteúdo do arquivo .md será carregado aqui -->
    </div>

  </main>

  <script>
    // Função para converter Markdown para HTML
    function markdownToHtml(markdown) {
      // Converter cabeçalhos
      let html = markdown
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        .replace(/^\* (.*$)/gim, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ol>$1</ol>')
        .replace(/!\[(.*?)\]\((.*?)\)/gim, '<img src="$2" alt="$1">')
        .replace(/\[(.*?)\]\((.*?)\)/gim, '<a href="$2">$1</a>')
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/^(?!<[h|u|o])(.*$)/gim, '<p>$1</p>');

      return html;
    }

    // Função para carregar o arquivo markdown
    async function loadMarkdownFile(filename) {
      try {
        const response = await fetch(`docs/${filename}`);
        if (!response.ok) {
          throw new Error(`Erro ao carregar o arquivo: ${response.statusText}`);
        }
        const markdown = await response.text();
        const html = markdownToHtml(markdown);
        
        // Atualizar o título da página
        const titleMatch = markdown.match(/^# (.*)$/m);
        if (titleMatch) {
          document.getElementById('page-title').textContent = titleMatch[1];
        }
        
        // Atualizar o conteúdo
        document.getElementById('content').innerHTML = html;
        
        // Rolar para o topo
        window.scrollTo(0, 0);
        
      } catch (error) {
        console.error('Erro ao carregar o arquivo markdown:', error);
        document.getElementById('content').innerHTML = `
          <h1>Erro ao carregar o conteúdo</h1>
          <p>Não foi possível carregar o arquivo. Por favor, tente novamente mais tarde.</p>
          <p><strong>Erro:</strong> ${error.message}</p>
        `;
      }
    }

    // Obter o nome do arquivo da URL
    function getFilenameFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('file') || 'index.md';
    }

    // Carregar o arquivo quando a página for carregada
    document.addEventListener('DOMContentLoaded', function() {
      const filename = getFilenameFromUrl();
      loadMarkdownFile(filename);
    });
  </script>

</body>
</html>
